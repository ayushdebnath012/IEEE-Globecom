name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      # Errors only: these are research scripts, so style conventions are not
      # gated. import-error is disabled because the ML dependencies (torch,
      # transformers, google.colab) are not installed here; the runs happen on
      # Colab and on the lab server, not in CI.
      run: |
        pylint --errors-only --disable=import-error $(git ls-files '*.py')
